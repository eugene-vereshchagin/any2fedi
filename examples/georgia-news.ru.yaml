instance: https://social.example.com
state_db: /srv/any2fedi/state/state.db
post_delay_seconds: 3

texts:
  template: "{text}\n\n{forwarded}\n\n{media_note}\n\n{footer}\n\n{hashtags}"
  footer: "— {source}: {url}"
  forwarded: "↪ переслано из: {name}"
  unsupported_media: "🎬 видео / вложение — в оригинале"
  truncated: "… (полностью — в оригинале)"
  rss_title: "**{title}**"

defaults:
  visibility: public
  language: ru
  content_type: text/markdown
  max_media: 10
  max_media_bytes: 10485760
  max_chars: 5000
  backfill: 0
  video_thumbs: true
  skip_textless_video: true
  # skip posts whose text matches any of these regexes (case-insensitive)
  skip_if: ["#реклама", "#промо", "^реклама\\.?$"]

accounts:

  georgia_news:
    token: "PASTE_TOKEN_FROM_get_token.py"
    hashtags: ["#georgia_news"]
    sources:

      - type: telegram
        channel: ProGeorgian
        label: "Про Грузию"
        strip_lines: ["^📲"]               # "📲 Телеграм / Предложить новость"

      - type: telegram
        channel: NGnewsgeorgia
        label: "NEWSGEORGIA"
        strip_lines: ["^@NGnewsgeorgia$"]  # channel signature at the end
